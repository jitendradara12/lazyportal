name: Portal drift probe
on:
  schedule:
    # Daily tripwire: JUET redeploys silently and our crypto/endpoints assume
    # exact bundle contents. Any marker vanishing means "they rotated" — go red.
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  probe:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check portal bundle markers and captcha shape
        run: |
          set -euo pipefail
          CA_BUNDLE=$(mktemp)
          trap 'rm -f "$CA_BUNDLE"' EXIT
          cat /etc/ssl/certs/ca-certificates.crt shared/portal-intermediate.pem > "$CA_BUNDLE"
          HTML=$(curl -fsSL --cacert "$CA_BUNDLE" --max-time 30 https://studentportal.juet.ac.in/studentportal/)
          MAIN=$(printf '%s' "$HTML" | grep -oE 'main\.[A-Za-z0-9]+\.js' | head -n 1)
          test -n "$MAIN"
          echo "bundle: $MAIN"
          JS=$(curl -fsSL --cacert "$CA_BUNDLE" --max-time 60 "https://studentportal.juet.ac.in/studentportal/$MAIN")
          for marker in generatewebtoken pretoken-check dcek9wb8frty1pnm StudentPortalAPI GetNavigation; do
            printf '%s' "$JS" | grep -q "$marker" || { echo "missing marker: $marker"; exit 1; }
          done
          echo "markers ok"
          curl -fsSL --cacert "$CA_BUNDLE" --max-time 30 https://studentportal.juet.ac.in/StudentPortalAPI/token/getcaptcha \
            | python3 -c "import json,sys; c=json.load(sys.stdin)['response']['captcha']; assert c['hidden'] and c['image']; print('captcha shape ok')"
