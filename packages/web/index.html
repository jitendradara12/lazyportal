    <script>
      (function () {
        try {
          var t = localStorage.getItem("juet.portal.theme");
          var d = t === "light" || t === "dark" ? t : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", d);
          if (t === "light" || t === "dark") {
            var m = document.querySelector('meta[name="color-scheme"]');
            if (m) m.setAttribute("content", t);
            var c = t === "dark" ? "#141316" : "#FCF8FD";
            var tc = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < tc.length; i++) tc[i].setAttribute("content", c);
          }
        } catch (e) {}
      })();
    </script>
